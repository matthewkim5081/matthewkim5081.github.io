<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>우리의 활동 | 김대엽 · 최인영</title>
<meta name="description" content="미팅, 제품 데모, 세미나, 제품 사용, 요리, 강의. 김대엽·최인영 부부의 활동 사진">
<meta property="og:title" content="우리의 활동 | 김대엽 · 최인영">
<meta property="og:description" content="미팅, 제품 데모, 세미나, 요리, 강의 사진">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}
.chips a{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);text-decoration:none;font-size:15px;background:var(--bg)}
.chips a span{color:var(--soft);font-size:13px}
.chips a:hover{border-color:var(--coral)}
.cat{padding-top:clamp(36px,5vw,56px)}
.cat h2{font-size:clamp(24px,3vw,32px)}
.cat .lead{margin-top:6px}
.masonry{columns:3 240px;column-gap:12px;margin-top:20px}
.masonry button{display:block;width:100%;margin:0 0 12px;padding:0;border:0;border-radius:12px;overflow:hidden;background:var(--sage);cursor:zoom-in;break-inside:avoid}
.masonry img{display:block;width:100%;height:auto;transition:transform .3s}
.masonry button:hover img{transform:scale(1.03)}
.masonry button:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.lb{position:fixed;inset:0;z-index:20;background:#0b1410f2;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.lb .bar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;color:#eef6f1}
.lb .bar b{font-family:"Gowun Batang",serif;font-size:18px}
.lb .stage{position:relative;display:grid;place-items:center;min-height:0;padding:0 56px}
.lb .stage img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px;user-select:none}
.lb button{border:0;background:#ffffff1f;color:#fff;border-radius:999px;width:48px;height:48px;font-size:24px;cursor:pointer;display:grid;place-items:center}
.lb button:hover{background:#ffffff38}
.lb .prev,.lb .next{position:absolute;top:50%;transform:translateY(-50%)}
.lb .prev{left:4px}.lb .next{right:4px}
.lb .strip{display:flex;gap:6px;overflow-x:auto;padding:10px 16px 14px}
.lb .strip img{height:56px;width:56px;object-fit:cover;border-radius:6px;opacity:.5;cursor:pointer;flex:none}
.lb .strip img.on{opacity:1;outline:2px solid var(--coral)}
@media(max-width:600px){.masonry{columns:2;column-gap:8px}.masonry button{margin-bottom:8px}.lb .stage{padding:0 8px}.lb .prev,.lb .next{top:auto;bottom:8px;transform:none}}
</style>
</head>
<body>

<nav><div class="in">
<a class="logo" href="index.html">대엽<b>&amp;</b>인영</a>
<ul><li><a href="index.html#who">소개</a></li><li><a href="story-inyoung.html">인영의 이야기</a></li><li><a href="story-daeyeop.html">대엽의 이야기</a></li><li><a href="guide.html">암웨이 안내</a></li><li><a href="index.html#contact">이야기 나누기</a></li></ul>
</div></nav>

<main class="band"><div class="in">
<a class="back" href="index.html#activity">← 처음으로</a>
<h1 style="font-size:clamp(32px,4.6vw,48px)">우리의 하루, 우리의 활동</h1>
<p class="lead">사람을 만나고, 함께 배우고, 좋은 것을 나누는 순간들입니다. 사진을 누르면 크게 볼 수 있어요.</p>
<div class="chips" id="chips"></div>
<div id="cats"></div>
</div></main>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="사진 크게 보기">
<div class="bar"><div><b id="lbT"></b> <span id="lbN"></span></div><button id="lbX" aria-label="닫기">✕</button></div>
<div class="stage"><button class="prev" id="lbP" aria-label="이전 사진">‹</button><img id="lbI" alt=""><button class="next" id="lbF" aria-label="다음 사진">›</button></div>
<div class="strip" id="lbS"></div>
</div>

<footer class="band"><div class="in">
<div>김대엽·최인영 · 암웨이 독립사업자(ABO)가 개인적으로 운영하는 페이지이며, 한국암웨이 공식 사이트가 아닙니다.</div>
<div>사진 속 다른 분들의 얼굴은 가렸습니다.</div>
</div></footer>

<script src="photos.js"></script>
<script>{
const P=window.PHOTOS||[];
const $=id=>document.getElementById(id);
$('chips').innerHTML=P.map(c=>`<a href="#${c.key}">${c.title} <span>${c.items.length}</span></a>`).join('');
$('cats').innerHTML=P.map((c,ci)=>`<section class="cat" id="${c.key}"><h2>${c.title}</h2><p class="lead">${c.desc}</p><div class="masonry">${c.items.map((p,i)=>`<button data-c="${ci}" data-i="${i}" aria-label="${c.title} 사진 ${i+1}"><img src="photos/thumb/${p.f}" width="${p.w}" height="${p.h}" alt="${c.title} ${i+1}" loading="lazy"></button>`).join('')}</div></section>`).join('');
let C=0,I=0,last=null;
const lb=$('lb'),img=$('lbI');
function show(){const c=P[C],p=c.items[I];img.src='photos/full/'+p.f;img.alt=c.title+' '+(I+1);$('lbT').textContent=c.title;$('lbN').textContent=`${I+1} / ${c.items.length}`;
[...$('lbS').children].forEach((t,k)=>t.classList.toggle('on',k===I));$('lbS').children[I]?.scrollIntoView({block:'nearest',inline:'center'});
const n=c.items[(I+1)%c.items.length];new Image().src='photos/full/'+n.f;}
function open(c,i){C=c;I=i;last=document.activeElement;$('lbS').innerHTML=P[C].items.map((p,k)=>`<img src="photos/thumb/${p.f}" alt="" data-k="${k}">`).join('');lb.hidden=false;document.body.style.overflow='hidden';show();$('lbX').focus();}
function close(){lb.hidden=true;document.body.style.overflow='';last?.focus();}
const step=d=>{const n=P[C].items.length;I=(I+d+n)%n;show();};
$('cats').addEventListener('click',e=>{const b=e.target.closest('button[data-c]');if(b)open(+b.dataset.c,+b.dataset.i);});
$('lbX').onclick=close;$('lbP').onclick=()=>step(-1);$('lbF').onclick=()=>step(1);
$('lbS').addEventListener('click',e=>{const t=e.target.closest('img[data-k]');if(t){I=+t.dataset.k;show();}});
lb.addEventListener('click',e=>{if(e.target===lb||e.target.classList.contains('stage'))close();});
document.addEventListener('keydown',e=>{if(lb.hidden)return;if(e.key==='Escape')close();if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1);});
let x0=null;img.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});
img.addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>40)step(dx<0?1:-1);x0=null;});
if(location.hash){const el=document.getElementById(location.hash.slice(1));if(el)setTimeout(()=>el.scrollIntoView(),0);}
}</script>
</body>
</html>
